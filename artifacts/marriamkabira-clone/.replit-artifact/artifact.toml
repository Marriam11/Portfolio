kind = "web"
previewPath = "/"
title = "Marriam Sajjad Portfolio"
description = "A developer portfolio for Marriam Sajjad, including work case studies, an about page, a playground, theme toggle, navigation, motion, and responsive behavior."
version = "1.0.0"
id = "artifacts/marriamkabira-clone"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23064

[services.development]
run = "pnpm --filter @workspace/marriamkabira-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marriamkabira-clone", "run", "build" ]
serve = "static"
publicDir = "artifacts/marriamkabira-clone/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23064"
BASE_PATH = "/"
